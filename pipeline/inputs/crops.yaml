# Crop rules for the rotation planner (Lithuania).
# Version and the rules for interpreting null / severity are in meta.
meta:
  version: '0.2'
  compiled: '2026-11-12'
  country: LT
  date_convention: Dates are "MM-DD" strings in the Lithuanian calendar. Harvest year = calendar year of harvest. Winter crops are sown in year t-1 (August–October) and harvested in year t; spring crops are sown and harvested in year t. The preceding crop of a winter crop of harvest year t is the crop harvested in year t-1 before its sowing.
  page_convention: 'page = PDF page number in sequence (1 = first page of the file), not the printed number. In the IKOK guides the printed number = page - 1.'
  identity_fields_without_src: [names, groups, season]
  precedence: A rule for a specific crop overrides a rule for a group. At equal specificity bad overrides good.
  src_format: '{id: source label, page: PDF page number or null, where: table or section}'
  status_values: {primary: primary source read, snippet: only an abstract or a fragment was seen, secondary: 'encyclopedia, news, retelling; or the value is taken from our earlier notes without re-checking', estimate: our judgement or a conclusion drawn from the source numbers, calculation: calculated by us from open data}
  status_default: primary
  sources:
    K: {title: Crop classes in the open NMA declarations 2024–2025 and EuroCrops 2021 (calculation), url: null, status: calculation, kind: our calculation from open declarations, reliability: reproducible from the open declarations}
    IKOK-WW: {title: 'LAMMC IKOK gairės. Žieminiai kviečiai (2-as leid., 2024)', url: 'https://www.lammc.lt/data/public/uploads/2025/11/2025_ikok_zieminiai_kvieciai_maketas_taisytas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-SW: {title: LAMMC IKOK gairės. Vasariniai kviečiai (2024), url: 'https://www.lammc.lt/data/public/uploads/2025/12/2025_ikok_vasariniai_kvieciai_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-RYE: {title: 'LAMMC IKOK gairės. Žieminiai rugiai (2-as leid., 2024)', url: 'https://www.lammc.lt/data/public/uploads/2025/10/2025_ikok_zieminiai_rugiai_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-OAT: {title: 'LAMMC IKOK gairės. Avižos (2-as leid., 2024)', url: 'https://lammc.lt/data/public/uploads/2026/01/2025_ikok_avizos_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-WR: {title: 'LAMMC IKOK gairės. Žieminiai rapsai (2-as leid., 2024)', url: 'https://www.lammc.lt/data/public/uploads/2025/10/2025_ikok_zieminiai_rapsai_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-SR: {title: 'LAMMC IKOK gairės. Vasariniai rapsai (2-as leid., 2024)', url: 'https://lammc.lt/data/public/uploads/2025/10/2025_ikok_vasariniai_rapsai_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-PEA: {title: LAMMC IKOK gairės. Žirniai (2024), url: 'https://lammc.lt/data/public/uploads/2025/12/2025_ikok_zirniai_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-BEAN: {title: 'LAMMC IKOK gairės. Pupos (2-as leid., 2024)', url: 'https://lammc.lt/data/public/uploads/2025/12/2025_ikok_pupos_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-POT: {title: 'LAMMC IKOK gairės. Bulvės (2-as leid., 2024)', url: 'https://www.lammc.lt/data/public/uploads/2025/12/2025_ikok_bulves_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    IKOK-MAIZE: {title: 'LAMMC IKOK gairės. Kukurūzai (2-as leid., 2024)', url: 'https://lammc.lt/data/public/uploads/2025/10/2025_ikok_kukuruzai_maketas.pdf', status: primary, kind: state methodological guidelines (LAMMC), reliability: 'high: Lithuanian, 2024, authors named; an independent sample of 43 of 45 references is correct'}
    GDD: {title: LAMMC. Augalų vystymosi tarpsnių ir agroklimatinių rodiklių sąsajos tyrimai (pristatymas 2026-01-28), url: 'https://zum.lrv.lt/public/canonical/1769771241/19022/Prezentacija_%20Augal%C5%B3%20vystymosi%20tarpsni%C5%B3_VDU_2026_01_28_.pdf', status: primary, kind: 'slides of the LAMMC 2023–2025 project (Žydelis, Danytė, Povilaitis), published on the ŽŪM website', reliability: 'medium: recent Lithuanian trials (274), but this is a presentation, not a peer-reviewed article; no article found on Zenodo'}
    Best4Soil: {title: 'Best4Soil. Augalų sėjomaina: praktinė informacija (LT)', url: 'https://orgprints.org/id/eprint/43540/13/LT_AUGALU%CC%A8%20SE%CC%87JOMAINA_%20PRAKTINE%CC%87%20INFORMACIJA%20%281%29.pdf', status: primary, kind: 'leaflet of an EU Horizon 2020 project (grant 817696), Lithuanian translation', reliability: 'medium: pan-European, not Lithuanian trials — hence soft penalties only'}
    Joniskelis: {title: 'Žemės ūkio mokslai 2012, 19(4): žaliosios trąšos sėjomainose su žieminiais javais', url: 'https://lmaleidykla.lt/ojs/index.php/zemesukiomokslai/article/download/2583/1419', status: primary, kind: article in "Žemės ūkio mokslai" (Lithuanian Academy of Sciences), reliability: 'high, but a single-station trial'}
    VDU-rotations: {title: 'Žemės ūkio mokslai 2019, 26(2): ilgalaikė augalų kaita', url: 'https://lmaleidykla.lt/ojs/index.php/zemesukiomokslai/article/download/4060/2868', status: primary, kind: article in "Žemės ūkio mokslai" (Lithuanian Academy of Sciences), reliability: 'high, but a single-station trial'}
    ZUM-2026: {title: 'ŽŪM, laikraštis apie 2026 m. išmokas', url: 'https://zum.lrv.lt/public/canonical/1776052984/19279/2026-laikrastis-spaudai.pdf', status: primary, kind: official ŽŪM / NMA publication on 2026 payments, reliability: high for payment rules}
    VDU-barley: {title: 'VDU, vasarinių miežių sėjos laikas', url: 'https://ejournals.vdu.lt/index.php/jm2022/lt/article/download/701/385/1694', status: secondary, kind: article from the VDU student conference of young scientists, reliability: 'low: one year (2025), one farm (Kelmė); the 7–22 Apr window is quoted from Noworolnik 2012 (Poland)'}
    VLE-barley: {title: 'VLE, miežiai', url: 'https://www.vle.lt/straipsnis/mieziai/', status: secondary, kind: VLE encyclopedia article, reliability: 'low: general reference without trials or source dates'}
    VLE-beet: {title: 'VLE, cukriniai runkeliai', url: 'https://www.vle.lt/straipsnis/cukriniai-runkeliai/', status: secondary, kind: VLE encyclopedia article, reliability: 'low: general reference without trials or source dates'}
    VLE-buckwheat: {title: 'VLE, grikiai', url: 'https://www.vle.lt/straipsnis/grikiai/', status: secondary, kind: VLE encyclopedia article, reliability: 'low: general reference without trials or source dates'}
    Zemdirbyste-beet: {title: 'Petkevičienė B. Sėjos laiko ir veislių įtaka cukrinių runkelių produktyvumui. Žemdirbystė 95(4), 2008, p. 59–70', url: 'https://zemdirbyste-agriculture.test.deimantinis.lm.lt/95(4)tomas/95_4_tomas_59_70.pdf', status: primary, kind: article in "Žemdirbystė" (peer-reviewed LAMMC journal), reliability: 'low for sowing dates: the 15–26 Apr window is the result of trials at Rumokai in 1973–1975, retold in a 2008 article. The link leads to a test copy of the journal website (…test.deimantinis.lm.lt)'}
    ZUDC-2021: {title: 'ŽŪDC, javapjūtės eiga 2021 m. rugpjūtis', url: 'https://zudc.lt/wp-content/uploads/2024/01/Siu-metu-rugpjucio-antroje-puseje-Lietuvoje-nukulta-daugiau-grudiniu-augalu-negu-praejusiu-metu-analogisku-metu.pdf', status: snippet, kind: ŽŪDC operational summary, reliability: 'medium: preliminary data, only farms ≥ 50 ha'}
    K-T: {title: Crop transitions 2024 → 2025 from declarations (calculation), url: null, status: calculation, kind: our calculation from open declarations, reliability: reproducible from the open declarations}
  revised: '2026-11-12 (after independent verification)'
  status_default_meaning: 'primary = the value is in the source on the stated page. Manually re-checked: all hard rules, all intervals, sowing windows and GDD + a sample of 45 references. Our conversion to MM-DD dates or to BBCH codes is marked separately as estimate'
  null_semantics: 'null = unknown. The planner must NOT treat null as "allowed": a check that lacks a date returns "unknown", and this is shown in the interface next to the variant'
  severity_values: {hard: 'filter: do not offer the variant', soft: penalty in the objective function + reason in the interface, info: 'explanation, does not affect the calculation'}
  sowing_latest_semantics: 'sowing.latest is the date after which the source considers sowing undesirable; always soft (penalty D7), no source gives a physical ban by sowing date'
  known_issues: ['Group and crop identifiers partly coincide (perennial_grasses, sugar_beet; early_potato and fallow with pseudo-crops): ref is ambiguous. Not fixed', 'At equal specificity bad overrides good, so a good entry with a condition (spring rapeseed after first-year clover) is always overridden. Not fixed']
  policy_note: policy_rules are not agronomy. The applies_to field says whom the rule applies to
policy_rules:
- id: eco_no_same_crop_twice
  rule: Do not sow the same crop two years in a row on the same field
  applies_to: participants_of_eco_scheme_augalu_kaita
  severity: hard
  src:
  - {id: ZUM-2026, page: 18, where: 'Ūkio darbų kalendorius, veikla „Augalų kaita“'}
- id: eco_min_4_crops
  rule: At least 4 different crops per year on the declared area
  applies_to: participants_of_eco_scheme_augalu_kaita
  severity: hard
  src:
  - {id: ZUM-2026, page: 18, where: 'Ūkio darbų kalendorius, veikla „Augalų kaita“'}
- id: eco_legume_each_year
  rule: Every year one of the crops is a legume
  applies_to: participants_of_eco_scheme_augalu_kaita
  severity: hard
  src:
  - {id: ZUM-2026, page: 18, where: 'Ūkio darbų kalendorius, veikla „Augalų kaita“'}
- id: eco_main_crop_max_50pct
  rule: The main crop is at most 50% of the declared area (for commitments from 2025)
  applies_to: participants_of_eco_scheme_augalu_kaita
  severity: hard
  src:
  - {id: ZUM-2026, page: 18, where: 'Ūkio darbų kalendorius, veikla „Augalų kaita“'}
- id: mow_grass_legumes_by_0901
  rule: Mow meadows and herbaceous nitrogen-fixing crops on arable land at least once before 09-01
  applies_to:
    crops: [perennial_grasses, clover]
    who: all applicants for direct payments
  severity: hard
  src:
  - {id: ZUM-2026, page: 7, where: 6. Laikytis šienavimo terminų}
- id: legumes_share_min
  rule: Legumes (grain legumes) should take at least 12.5% of the rotation
  applies_to: rotation
  severity: soft
  src:
  - {id: IKOK-PEA, page: 5, where: 1. Sėjomaina}
pseudo_crops:
  black_fallow:
    names: {lt: juodasis pūdymas, ru: чёрный пар, en: black fallow}
  green_fallow:
    names: {lt: žaliasis pūdymas, ru: зелёный (занятый) пар, en: green fallow}
    note: brassicas must not be sown in green fallow before winter rapeseed
    src:
    - {id: IKOK-WR, page: 6, where: 1. Sėjomaina (tekstas po 1 lentelės)}
  early_potato:
    names: {lt: ankstyvosios bulvės, ru: ранний картофель, en: early potato}
    harvest: {from: null, to: null, todo: harvest date of early potato in Lithuania}
  green_manure_legumes:
    names: {lt: pupiniai augalai žaliajai trąšai, ru: бобовые на сидерат, en: legumes for green manure}
  lucerne:
    names: {lt: liucernos, ru: люцерна, en: lucerne}
  vetch:
    names: {lt: vikiai, ru: вика, en: vetch}
  vetch_oat_mix:
    names: {lt: vikių ir avižų mišiniai, ru: вико-овсяная смесь, en: vetch-oat mix}
  flax:
    names: {lt: linai, ru: лён, en: flax}
groups:
  cereals:
    note: 'Small-grain cereals (migliniai javai). Maize is a separate group maize, although botanically it is a cereal'
    members: [winter_wheat, spring_wheat, winter_barley, spring_barley, triticale, winter_rye, oats]
  winter_cereals:
    members: [winter_wheat, winter_barley, triticale, winter_rye]
  spring_cereals:
    members: [spring_wheat, spring_barley, oats]
  wheat:
    note: 'Triticum, for the Best4Soil interval'
    members: [winter_wheat, spring_wheat]
  barley:
    note: 'Hordeum, for the Best4Soil interval'
    members: [winter_barley, spring_barley]
  brassicas:
    note: Brassicas (bastutiniai / kryžmažiedžiai)
    members: [winter_rapeseed, spring_rapeseed]
  legumes:
    note: All legumes (pupiniai / ankštiniai)
    members: [peas, faba_bean, lupin, clover, lucerne, vetch, green_manure_legumes]
  grain_legumes:
    members: [peas, faba_bean, lupin]
  forage_legumes:
    members: [clover, lucerne, vetch]
  perennial_grasses:
    note: 'Daugiametės žolės, including legume-grass mixtures'
    members: [perennial_grasses, clover, lucerne]
  row_crops:
    note: Kaupiamieji augalai (row crops). For winter crops maize is banned by a separate rule
    members: [potato, early_potato, sugar_beet, maize_grain, maize_silage]
  root_crops:
    note: Šakniavaisiai
    members: [sugar_beet]
  maize:
    members: [maize_grain, maize_silage]
  potatoes:
    members: [potato, early_potato]
  fallow:
    members: [black_fallow, green_fallow]
  black_fallow:
    members: [black_fallow]
  green_fallow:
    members: [green_fallow]
  early_potato:
    members: [early_potato]
  sugar_beet:
    members: [sugar_beet]
crops:
  winter_wheat:
    names: {lt: žieminiai kviečiai, ru: озимая пшеница, en: winter wheat}
    groups: [cereals, winter_cereals, wheat]
    season: winter
    declaration_class:
      code: winter_cereals
      src:
      - {id: K, page: null, where: crop classes table}
    sowing:
      optimal: {from: 09-10, to: 09-25}
      latest: 10-10
      notes:
      - text: Must start tillering before the end of autumn vegetation
        src:
        - {id: IKOK-WW, page: 7, where: 3. Sėjos laikas ir gylis}
      - text: 'Late sowing: shallower (≤3 cm) and a higher seeding rate'
        src:
        - {id: IKOK-WW, page: 7, where: 3. Sėjos laikas ir gylis; 4. Sėklos norma}
      src:
      - {id: IKOK-WW, page: 7, where: 3. Sėjos laikas ir gylis}
      latest_severity: soft
    harvest:
      from: null
      to: null
      todo: harvest dates from the primary source; IKOK-WW gives only the ripeness criterion (BBCH 89)
      criterion:
        text: Threshed at full grain ripeness
        src:
        - {id: IKOK-WW, page: 35, where: VII. Derliaus nuėmimas ir saugojimas}
      estimate: {from: 07-25, to: 08-31, status: estimate, note: 'rye from the end of July (IKOK-RYE p33); by 2021-08-20, 71.8% of cereals were harvested (ZUDC-2021, snippet)'}
    gdd:
      base_c: 0
      t_max_c: [30, 35]
      sowing_to_maturity_c: [2523, 2764]
      bbch_model: BBCH = 110.00·exp(−exp(1.15 − 0.00107·GDD))
      src:
      - {id: GDD, page: 5, where: Augimo temperatūrų sumos skaičiavimai (lentelė)}
      - {id: GDD, page: 12, where: Išvados 1–2}
    previous_crops:
      good:
      - ref: perennial_grasses
        reason: raise fertility and humus
        severity: soft
        src:
        - {id: IKOK-WW, page: 5, where: 1 lentelė. Žieminių kviečių priešsėliai}
      - ref: brassicas
        reason: improve phytosanitary condition and soil properties
        severity: soft
        src:
        - {id: IKOK-WW, page: 5, where: 1 lentelė. Žieminių kviečių priešsėliai}
      - ref: legumes
        reason: 'fertility, nitrogen'
        severity: soft
        src:
        - {id: IKOK-WW, page: 5, where: 1 lentelė. Žieminių kviečių priešsėliai}
      - ref: green_manure_legumes
        reason: 'soil structure, more nutrients'
        severity: soft
        src:
        - {id: IKOK-WW, page: 5, where: 1 lentelė. Žieminių kviečių priešsėliai}
      - ref: early_potato
        reason: 'fertility, fewer weeds, easier soil preparation'
        severity: soft
        src:
        - {id: IKOK-WW, page: 5, where: 1 lentelė. Žieminių kviečių priešsėliai}
      - ref: black_fallow
        reason: lower weed-control costs
        severity: soft
        src:
        - {id: IKOK-WW, page: 5, where: 1 lentelė. Žieminių kviečių priešsėliai}
      bad:
      - ref: cereals
        reason: 'related crops: infection, pests, weeds, higher protection costs'
        severity: soft
        src:
        - {id: IKOK-WW, page: 6, where: 1 lentelė (Nerekomenduojami)}
      - ref: maize_grain
        reason: 'harvested too late, no time to prepare the soil; Fusarium head blight'
        severity: hard
        src:
        - {id: IKOK-WW, page: 6, where: 1 lentelė (Nerekomenduojami)}
        - {id: IKOK-MAIZE, page: 5, where: 1. Sėjomaina (paskutinė pastraipa)}
      - ref: maize_silage
        reason: little time to prepare the soil; Fusarium head blight
        severity: soft
        src:
        - {id: IKOK-WW, page: 6, where: 1 lentelė (Nerekomenduojami)}
      notes:
      - text: 'The more fertile the soil and the better the weather, the smaller the effect of the preceding crop'
        src:
        - {id: IKOK-WW, page: 6, where: Svarbu! after 1 lentelė}
    return_interval_years:
      min: 2
      recommended: null
      scope: wheat
      todo: LAMMC gives no interval for wheat
      src:
      - {id: Best4Soil, page: 2, where: '1 lentelė, eilutė Triticum aestivum (1:2)'}
      severity: soft
      basis: Best4Soil
    vulnerable_phases:
    - phase: sowing
      months: [9, 10]
      hazard: dry seedbed
      threshold: 'soil moisture 9–12%: seeds lie 30–40 days, poor emergence'
      src:
      - {id: IKOK-WW, page: 7, where: 3. Sėjos laikas ir gylis}
    - phase: autumn until the end of vegetation
      bbch: '21'
      hazard: did not start tillering before winter
      threshold: tillering must start before the end of autumn vegetation
      src:
      - {id: IKOK-WW, page: 7, where: 3. Sėjos laikas ir gylis (Svarbu!)}
      bbch_status: estimate
    - phase: heading and grain filling
      bbch: 51–75
      hazard: grain aphid (Sitobion avenae)
      threshold: 20–30% of stems infested and 2–3 aphids per ear
      src:
      - {id: IKOK-WW, page: 33, where: 5. Purškimas pagal žalingumo ribas}
      bbch_status: estimate
    - phase: end of stem elongation
      bbch: 37–39
      hazard: thrips
      threshold: 50% of stems and 1–2 thrips per stem
      src:
      - {id: IKOK-WW, page: 33, where: 5. Purškimas pagal žalingumo ribas}
      bbch_status: estimate
    - phase: vegetation
      bbch: null
      hazard: cereal sawflies (javiniai lapiniai pjūkleliai)
      threshold: 50 larvae/m²
      src:
      - {id: IKOK-WW, page: 33, where: 5. Purškimas pagal žalingumo ribas}
      bbch_status: estimate
    - phase: flowering
      bbch: 61–69
      hazard: Fusarium head blight
      threshold: moisture in the crop for 48–72 h at 22–27 °C — outbreak forecast
      src:
      - {id: IKOK-WW, page: 24, where: IV.1 Svarbiausios grybinės ligos (varpų fuzariozė)}
      bbch_status: estimate
  spring_wheat:
    names: {lt: vasariniai kviečiai, ru: яровая пшеница, en: spring wheat}
    groups: [cereals, spring_cereals, wheat]
    season: spring
    declaration_class:
      code: spring_cereals
      src:
      - {id: K, page: null, where: crop classes table}
    sowing:
      optimal: {from: null, to: null}
      rule: as_early_as_soil_workable
      latest: null
      todo: no calendar dates — only "as early as possible"
      estimate: {from: 04-05, to: 04-25, status: estimate, note: 'by analogy with spring barley (VDU-barley, secondary)'}
      notes:
      - text: 'Sow early, as soon as the soil can be worked; late sowing — poorer emergence and a thin stand'
        src:
        - {id: IKOK-SW, page: 6, where: 3. Sėjos laikas ir gylis}
      src:
      - {id: IKOK-SW, page: 6, where: 3. Sėjos laikas ir gylis}
    harvest: {from: null, to: null, todo: harvest dates of spring wheat from the primary source}
    gdd:
      base_c: [0, 2]
      t_max_c: 35
      sowing_to_maturity_c: [1855, 2036]
      status: estimate
      note: 'the sum is given for spring cereals as a whole, not for wheat separately'
      src:
      - {id: GDD, page: 5, where: Augimo temperatūrų sumos skaičiavimai (lentelė)}
      - {id: GDD, page: 12, where: Išvados 3}
    previous_crops:
      good:
      - ref: perennial_grasses
        reason: 'fertility, humus, fewer weeds'
        severity: soft
        src:
        - {id: IKOK-SW, page: 5, where: 1 lentelė. Vasarinių kviečių priešsėliai}
      - ref: brassicas
        reason: 'phytosanitary condition, soil properties'
        severity: soft
        src:
        - {id: IKOK-SW, page: 5, where: 1 lentelė. Vasarinių kviečių priešsėliai}
      - ref: legumes
        reason: nitrogen and available phosphorus
        severity: soft
        src:
        - {id: IKOK-SW, page: 5, where: 1 lentelė. Vasarinių kviečių priešsėliai}
      - ref: row_crops
        reason: 'fertility, fewer weeds'
        severity: soft
        src:
        - {id: IKOK-SW, page: 5, where: 1 lentelė (Kaupiamieji augalai)}
      bad:
      - ref: cereals
        reason: 'shared infection, higher protection costs'
