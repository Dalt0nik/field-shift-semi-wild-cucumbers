derived_rules:
- id: D1_window_feasibility
  rule: 'For a winter crop c after a preceding crop p. Harvest date of p = actual date on the field (declaration, satellite — product P5), if known; otherwise p.harvest.from (or harvest.estimate.from). If harvest date + prep_days > c.sowing.optimal.to — soft penalty (D7) and the reason "sowing later than optimum". If any date is null — the result is "unknown": do not ban, show in the interface'
  params:
    prep_days: {value: 7, status: estimate, todo: check with agronomist}
  severity: soft
  status: estimate
  note: 'v0.1 was hard and used harvest.to: this banned pairs recommended by LAMMC (winter cereals → winter rapeseed, clover → rapeseed). A ban for late harvest is set only through previous_crops.bad with severity: hard, where the source says so directly'
- id: D2_wr_needs_harvest_by_mid_august
  rule: 'Winter rapeseed: if the preceding crop frees the field later than ~08-18 (08-25 − prep_days), sowing falls outside the optimum — soft penalty via D1/D7'
  inputs: [winter_rapeseed.sowing.optimal.to = 08-25, D1.prep_days]
  severity: soft
  status: estimate
- id: D3_spring_rapeseed_not_before_wr
  rule: 'Spring rapeseed before winter rapeseed: harvest 08-21…09-10 gives sowing after the optimum (D1, soft); in practice the pair is blocked anyway by the brassica interval (return_interval_years, hard)'
  inputs: [spring_rapeseed.harvest = end of August – beginning of September, winter_rapeseed.sowing.optimal.to = 08-25]
  severity: soft
  status: estimate
- id: D4_sugar_beet_before_winter_wheat
  rule: 'Sugar beet before winter wheat: if harvest is later than ~10-03, wheat sowing falls beyond 10-10 — soft penalty (D1/D7); the beet harvest date is secondary'
  inputs: [sugar_beet.harvest (secondary), winter_wheat.sowing.latest = 10-10, D1.prep_days]
  severity: soft
  status: estimate
- id: D5_faba_before_winter_wheat
  rule: 'Faba beans (harvest in September) before winter wheat are acceptable, but late harvest pushes sowing beyond the 09-25 optimum — soft penalty'
  inputs: [faba_bean.harvest = 09-01..09-30, winter_wheat.sowing]
  severity: soft
  status: estimate
- {id: D6_spring_crop_after_anything_window_ok, rule: 'For spring crops the sowing window is not limited by the harvest date of the preceding crop (harvest in year t-1, sowing in spring t)', severity: info, status: estimate}
- id: D7_late_sowing_penalty
  rule: 'Penalty per day of delay: faba beans 40–50 kg/ha; maize ~1%; winter rapeseed +10 days → overwintering down to 60%, −1…2 t/ha'
  src:
  - {id: IKOK-BEAN, page: 9, where: 6. Sėjos laikas}
  - {id: IKOK-MAIZE, page: 7, where: 4. Sėjos laikas}
  - {id: IKOK-WR, page: 8, where: 5. Sėjos laikas ir sėklos norma}
  severity: soft
  status: estimate
